<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Materiais - Gestão de Insumos MR</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="painel.html" class="brand-title">
      📦 Gestão de Insumos MR
    </a>
    <nav class="nav-links">
      <a href="painel.html" class="nav-link">Requisições</a>
      <a href="nova-requisicao.html" class="nav-link">Nova Requisição</a>
      <a href="materiais.html" class="nav-link active" id="nav-materiais">Materiais</a>
    </nav>
    <div class="user-profile">
      <span id="user-email" style="font-weight: 500; font-size: 0.85rem;"></span>
      <span id="user-role" class="user-badge"></span>
      <button id="btn-logout" class="btn btn-secondary btn-sm">Sair</button>
    </div>
  </header>

  <main class="main-content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
      <div>
        <h1 style="font-family: var(--font-display); font-size: 1.5rem; font-weight: 700;">Gestão de Materiais</h1>
        <p style="color: var(--on-surface-variant); font-size: 0.85rem;">Cadastre insumos, adicione estoque e gerencie a disponibilidade</p>
      </div>
      <button id="btn-novo-material" class="btn btn-primary">
        + Cadastrar Material
      </button>
    </div>

    <div class="card" style="padding: 0;">
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Unidade</th>
              <th>Saldo em Estoque</th>
              <th>Estoque Mínimo</th>
              <th>Status</th>
              <th style="text-align: right;">Ações</th>
            </tr>
          </thead>
          <tbody id="tbody-materiais">
            <tr>
              <td colspan="6" style="text-align: center; padding: 2rem;">Carregando materiais...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Cadastrar / Editar Material -->
  <div id="modal-material" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-material-title" class="modal-title">Cadastrar Material</h3>
        <button id="btn-close-modal" class="btn btn-secondary btn-sm" style="border:none;">✕</button>
      </div>
      <form id="form-material">
        <input type="hidden" id="material-id">
        <div class="form-group">
          <label class="form-label" for="material-nome">Nome do Material</label>
          <input type="text" id="material-nome" class="form-control" placeholder="Ex: Papel A4 Resma" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="material-unidade">Unidade de Medida</label>
          <input type="text" id="material-unidade" class="form-control" placeholder="Ex: resma, cx, un" required>
        </div>
        <div class="form-group" id="group-saldo-inicial">
          <label class="form-label" for="material-saldo">Saldo Inicial</label>
          <input type="number" id="material-saldo" class="form-control" min="0" value="0" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="material-estoque-min">Estoque Mínimo (Alerta)</label>
          <input type="number" id="material-estoque-min" class="form-control" min="0" value="0" required>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem;">
          <button type="button" id="btn-cancelar-modal" class="btn btn-secondary">Cancelar</button>
          <button type="submit" id="btn-salvar-material" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Entrada de Estoque -->
  <div id="modal-entrada" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Entrada de Estoque</h3>
        <button id="btn-close-entrada" class="btn btn-secondary btn-sm" style="border:none;">✕</button>
      </div>
      <form id="form-entrada">
        <input type="hidden" id="entrada-material-id">
        <p id="entrada-material-nome" style="font-weight: 600; margin-bottom: 1rem; color: var(--primary);"></p>
        <div class="form-group">
          <label class="form-label" for="entrada-quantidade">Quantidade a Adicionar</label>
          <input type="number" id="entrada-quantidade" class="form-control" min="1" placeholder="Ex: 10" required>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem;">
          <button type="button" id="btn-cancelar-entrada" class="btn btn-secondary">Cancelar</button>
          <button type="submit" id="btn-salvar-entrada" class="btn btn-primary">Adicionar Estoque</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/materiais.js"></script>
</body>
</html>
