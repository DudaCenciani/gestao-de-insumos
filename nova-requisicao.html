<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Requisição - Gestão de Insumos MR</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <a href="painel.html" class="brand-title">
      📦 Gestão de Insumos MR
    </a>
    <nav class="nav-links">
      <a href="painel.html" class="nav-link">Requisições</a>
      <a href="nova-requisicao.html" class="nav-link active">Nova Requisição</a>
      <a href="materiais.html" class="nav-link" id="nav-materiais">Materiais</a>
    </nav>
    <div class="user-profile">
      <span id="user-email" style="font-weight: 500; font-size: 0.85rem;"></span>
      <span id="user-role" class="user-badge"></span>
      <button id="btn-logout" class="btn btn-secondary btn-sm">Sair</button>
    </div>
  </header>

  <main class="main-content" style="max-width: 600px;">
    <div class="card">
      <h1 class="card-title">Nova Requisição de Material</h1>
      <p style="color: var(--on-surface-variant); font-size: 0.85rem; margin-bottom: 1.5rem;">
        Selecione o insumo desejado e informe a quantidade necessária.
      </p>

      <form id="form-nova-requisicao">
        <div class="form-group">
          <label class="form-label" for="select-material">Material</label>
          <select id="select-material" class="form-control" required>
            <option value="">Carregando materiais disponíveis...</option>
          </select>
        </div>

        <div class="form-group" id="group-info-saldo" style="display: none; background-color: var(--surface-container); padding: 0.75rem 1rem; border-radius: var(--radius-md);">
          <span style="font-size: 0.85rem; color: var(--tertiary);">Saldo em estoque:</span>
          <strong id="span-saldo-atual" style="color: var(--primary); font-size: 1rem; margin-left: 0.5rem;">0</strong>
          <span id="span-unidade" style="font-size: 0.85rem; color: var(--on-surface-variant);"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="quantidade">Quantidade Solicitada</label>
          <input type="number" id="quantidade" class="form-control" min="1" placeholder="Ex: 5" required disabled>
        </div>

        <div class="form-group">
          <label class="form-label" for="justificativa">Justificativa / Observação (Opcional)</label>
          <textarea id="justificativa" class="form-control" placeholder="Descreva brevemente o motivo da solicitação..."></textarea>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
          <a href="painel.html" class="btn btn-secondary" style="flex: 1;">Cancelar</a>
          <button type="submit" id="btn-enviar-requisicao" class="btn btn-primary" style="flex: 2;" disabled>
            Enviar Requisição
          </button>
        </div>
      </form>
    </div>
  </main>

  <script type="module" src="js/nova-requisicao.js"></script>
</body>
</html>
