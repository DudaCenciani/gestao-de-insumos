.75rem", "full": "9999px" }, "spacing": { "margin": "1rem", "margin-tablet": "1.5rem", "gutter-desktop": "1.5rem", "margin-desktop": "2rem", "space-xl": "2.5rem", "space-md": "1rem", "gutter": "1rem", "space-sm": "0.5rem", "space-xs": "0.25rem", "space-lg": "1.5rem" }, "fontFamily": { "body-lg": [ "Inter" ], "display-lg": [ "Space Grotesk" ], "body-sm": [ "Inter" ], "headline-md": [ "Space Grotesk" ], "headline-sm": [ "Space Grotesk" ], "body-md": [ "Inter" ], "display-lg-mobile": [ "Space Grotesk" ], "headline-lg": [ "Space Grotesk" ], "label-sm": [ "Inter" ], "label-md": [ "Inter" ] }, "fontSize": { "body-lg": [ "16px", { "lineHeight": "24px", "fontWeight": "400" } ], "display-lg": [ "32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" } ], "body-sm": [ "12px", { "lineHeight": "16px", "fontWeight": "400" } ], "headline-md": [ "20px", { "lineHeight": "28px", "fontWeight": "600" } ], "headline-sm": [ "16px", { "lineHeight": "24px", "fontWeight": "600" } ], "body-md": [ "14px", { "lineHeight": "20px", "fontWeight": "400" } ], "display-lg-mobile": [ "24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" } ], "headline-lg": [ "24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" } ], "label-sm": [ "11px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" } ], "label-md": [ "13px", { "lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "600" } ] } }, }, }</script></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex items-center justify-center min-h-screen"><main class="w-full flex items-center justify-center p-margin md:p-margin-tablet"><div class="flex flex-col w-full items-center justify-center relative">
<div class="absolute -top-32 -left-20 w-96 h-96 rounded-full bg-primary-fixed opacity-40 blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-28 -right-20 w-96 h-96 rounded-full bg-secondary-fixed opacity-40 blur-3xl pointer-events-none"></div>
<div class="w-full max-w-md relative z-10">
<div class="bg-surface-container-lowest rounded-xl p-space-lg md:p-space-xl shadow-xl transition-all duration-300 relative overflow-hidden">
<div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-primary via-secondary to-primary-container"></div>
<div class="flex flex-col items-center text-center mb-space-lg">
<div class="relative w-20 h-20 mb-space-md rounded-xl bg-surface-container flex items-center justify-center p-2 shadow-sm transition-transform duration-300 hover:scale-105">
<img alt="Logo MR Gestão de Insumos" class="w-full h-full object-contain rounded-lg" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDUsXPINLsVIyMteUNXUbuKTzgqOV6Dek5r7WbpQvVjMBgN3EGTd0RSKdIoEdFW8IWwzMWcc5pPvfW5AXEU9zQ0Azonyb3r3Sb86dgLG4I8NQ-t4iUU0XOmDx6SDV-KP4uywA3PD-EWyJ_TwdCGQren5ODVmbrdkyeLNfmpD2_er2S3nubl2f7f_3XXiPJaA-Fpr_5NEVIpCokhoaLXlAzoEpY7l_sFJQwjATvhIoexwnc37pIlTdn8ebM1WmIewiXb"/>
</div>
<span class="font-['Orbitron'] tracking-wider text-primary text-xl font-bold uppercase mb-1">
          Gestão de Insumos MR
        </span>
<p class="font-body-md text-body-md text-on-surface-variant font-medium">
          Sistema Interno de Requisição e Controle de Estoque
        </p>
</div>
<div class="hidden mb-space-md p-space-sm rounded-lg bg-error-container text-on-error-container flex items-center gap-space-xs transition-all duration-200" id="feedbackAlert">
<span class="material-symbols-outlined text-lg shrink-0">error</span>
<span class="font-body-sm text-body-sm font-medium" id="feedbackText">
          Credenciais inválidas ou usuário não autenticado.
        </span>
</div>
<form class="flex flex-col gap-space-md" id="loginForm" onsubmit="return false;">
<div class="flex flex-col gap-space-xs text-left">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1" for="emailInput">
<span>E-mail Corporativo</span>
<span class="text-primary font-bold">*</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant/60 pointer-events-none select-none text-xl">
              mail
            </span>
<input class="w-full h-10 pl-10 pr-4 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md focus:bg-surface-container-lowest focus:outline-none transition-colors duration-150" id="emailInput" name="email" placeholder="seu.email@empresa.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-space-xs text-left">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1" for="passwordInput">
<span>Senha</span>
<span class="text-primary font-bold">*</span>
</label>
<button class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors cursor-pointer" id="forgotPassBtn" type="button">
              Esqueceu o acesso?
            </button>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant/60 pointer-events-none select-none text-xl">
              lock
            </span>
<input class="w-full h-10 pl-10 pr-11 rounded-lg bg-surface-container-low text-on-surface font-body-md text-body-md focus:bg-surface-container-lowest focus:outline-none transition-colors duration-150" id="passwordInput" name="password" placeholder="••••••••••••" required="" type="password"/>
<button class="absolute right-2 w-8 h-8 flex items-center justify-center text-on-surface-variant/60 hover:text-on-surface transition-colors rounded" id="togglePassword" title="Mostrar/ocultar senha" type="button">
<span class="material-symbols-outlined text-lg" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between py-1">
<label class="inline-flex items-center gap-2 cursor-pointer select-none">
<input class="w-4 h-4 rounded accent-primary cursor-pointer" id="rememberDevice" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant">Lembrar neste terminal</span>
</label>
<span class="font-label-sm text-label-sm px-2 py-0.5 rounded-full bg-surface-container text-tertiary">
            v2.4
          </span>
</div>
<button class="w-full h-11 bg-primary text-on-primary font-headline-sm text-headline-sm rounded-lg shadow-md hover:bg-primary-container active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-2 mt-2 cursor-pointer" id="submitButton" type="submit">
<span>Entrar no Sistema</span>
<span class="material-symbols-outlined text-xl transition-transform duration-200 group-hover:translate-x-1">arrow_forward</span>
</button>
</form>
<div class="mt-space-lg pt-space-md bg-surface-container-low/50 -mx-space-lg md:-mx-space-xl -mb-space-lg md:-mb-space-xl px-space-lg md:px-space-xl pb-space-md flex flex-col items-center gap-2 text-center">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container text-tertiary">
<span class="material-symbols-outlined text-sm text-secondary" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label-sm text-label-sm font-semibold tracking-wide uppercase">
            Supabase Auth • RLS Ativado
          </span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant/80">
          Governança de Almoxarifado &amp; Requisitório Seguro • MR
        </p>
</div>
</div>
</div>
<script>
    (function () {
      const togglePassword = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('passwordInput');
      const eyeIcon = document.getElementById('eyeIcon');
      const loginForm = document.getElementById('loginForm');
      const feedbackAlert = document.getElementById('feedbackAlert');
      const feedbackText = document.getElementById('feedbackText');
      const emailInput = document.getElementById('emailInput');
      const forgotPassBtn = document.getElementById('forgotPassBtn');
      const submitBtn = document.getElementById('submitButton');

      if (togglePassword && passwordInput && eyeIcon) {
        togglePassword.addEventListener('click', function () {
          const isPassword = passwordInput.type === 'password';
          passwordInput.type = isPassword ? 'text' : 'password';
          eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        });
      }

      if (forgotPassBtn) {
        forgotPassBtn.addEventListener('click', function () {
          if (feedbackAlert && feedbackText) {
            feedbackText.textContent = "Para redefinir o acesso, contate o administrador de TI da MR.";
            feedbackAlert.classList.remove('hidden');
          }
        });
      }

      if (loginForm) {
        loginForm.addEventListener('submit', function (e) {
          e.preventDefault();
          const email = emailInput.value.trim();
          const pass = passwordInput.value.trim();

          submitBtn.disabled = true;
          submitBtn.classList.add('opacity-80');
          const originalBtnHtml = submitBtn.innerHTML;
          submitBtn.innerHTML = `
            <span class="material-symbols-outlined text-lg animate-spin">progress_activity</span>
            <span>Autenticando...</span>
          `;

          setTimeout(() => {
            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-80');
            submitBtn.innerHTML = originalBtnHtml;

            if (!email.includes('@') || pass.length < 6) {
              if (feedbackAlert && feedbackText) {
                feedbackText.textContent = "Credenciais inválidas ou usuário não autenticado.";
                feedbackAlert.classList.remove('hidden');
              }
            } else {
              if (feedbackAlert && feedbackText) {
                feedbackAlert.classList.remove('hidden');
                feedbackAlert.classList.remove('bg-error-container', 'text-on-error-container');
                feedbackAlert.classList.add('bg-surface-container-high', 'text-secondary');
                feedbackText.textContent = "Acesso autorizado. Redirecionando para requisições...";
              }
            }
          }, 800);
        });
      }
    })();
  </script>
</div></main></body></html>
